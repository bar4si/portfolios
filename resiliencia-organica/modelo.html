<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resiliência Orgânica — Bruno Roth</title>
<style>
:root{
  --bg:#0a0a0a; --ink:#ece9e2; --mute:#8f8c85; --faint:#6a6761; --line:#262523;
  --serif:"Palatino Linotype","Book Antiqua",Palatino,"Iowan Old Style",Georgia,serif;
  --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);overflow:hidden}
body{-webkit-font-smoothing:antialiased;cursor:default;user-select:none}
img{display:block}

.pg{position:fixed;inset:0;display:flex;opacity:0;visibility:hidden;transition:opacity .7s ease,visibility 0s .7s;background:var(--bg)}
.pg.on{opacity:1;visibility:visible;transition:opacity .7s ease;z-index:1}
.rev{flex-direction:row-reverse}

.ph{height:100vh;aspect-ratio:9/16;flex:none;margin:0;overflow:hidden;background:#111}
.ph img{width:100%;height:100%;object-fit:cover;transform:scale(1.04);transition:transform 2.4s ease-out}
.pg.on .ph img{transform:none}
.phs{display:flex;gap:.8vh;flex:none;align-items:center}
.pair{--h:min(100vh,calc((100vw - 24rem)*8/9))}
.pair .ph{height:var(--h)}

.lab{font-family:var(--sans);font-size:clamp(.68rem,1.55vh,.95rem);letter-spacing:.28em;text-transform:uppercase;color:var(--mute)}
.tx{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;padding:7vh clamp(1.5rem,4.5vw,6rem) 9vh}
.rev .tx{align-items:flex-end;text-align:right}
.cap{max-width:30rem}
.num{font-size:clamp(4rem,21vh,15rem);line-height:.9;color:transparent;-webkit-text-stroke:1px var(--faint);font-style:italic;letter-spacing:-.02em;margin-bottom:2vh}
.cap h2{font-size:clamp(1.9rem,6.6vh,5rem);font-weight:400;line-height:1.02;margin:0 0 2.2vh;letter-spacing:-.01em}
.cap p{font-size:clamp(1rem,2.7vh,1.6rem);line-height:1.5;color:#c9c5bd;margin:0}
.pair{align-items:center}
.pair .tx{align-self:stretch;justify-content:space-between;padding-left:clamp(1.2rem,3vw,4rem);padding-right:clamp(1.2rem,3vw,4rem)}
.pair .lab{align-self:center;text-align:center}
.pair .cap:last-child{text-align:right;align-self:flex-end}
.pair .num{font-size:clamp(2.6rem,10vh,7rem);margin-bottom:1vh}
.pair .cap h2{font-size:clamp(1.5rem,4.6vh,3.4rem);margin-bottom:1.4vh}
.pair .cap p{font-size:clamp(.95rem,2.3vh,1.35rem)}

/* capa */
.capa .tx{justify-content:space-between}
.capa h1{font-size:clamp(3rem,15.5vh,11rem);font-weight:400;line-height:.92;margin:0;letter-spacing:-.025em}
.capa h1 em{display:block;font-style:italic;color:#bdb9b0}
.capa .sub{font-size:clamp(1.1rem,3.4vh,2.2rem);font-style:italic;color:var(--mute);margin-top:3.5vh}
.capa .by{font-family:var(--sans);font-size:clamp(.75rem,1.8vh,1.05rem);letter-spacing:.2em;text-transform:uppercase;color:var(--mute);line-height:2}
.capa .by b{color:var(--ink);font-weight:500}

/* editorial */
.edit{flex-direction:column;justify-content:center;padding:8vh clamp(1.5rem,8vw,10rem)}
.edit .cols{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,7vw,8rem);margin-top:7vh}
.edit h3{font-family:var(--sans);font-size:clamp(.72rem,1.7vh,1rem);letter-spacing:.26em;text-transform:uppercase;color:var(--mute);font-weight:400;margin:0 0 2.5vh;padding-top:2.5vh;border-top:1px solid var(--faint)}
.edit .ans{font-size:clamp(1.7rem,5.6vh,4rem);font-style:italic;line-height:1.05;margin:0 0 3vh}
.edit p{font-size:clamp(1rem,2.65vh,1.55rem);line-height:1.55;color:#c9c5bd;margin:0 0 1.6vh}

/* ato */
.ato{align-items:center;justify-content:center;text-align:center;overflow:hidden}
.ato .bgim{position:absolute;inset:-8%;background-size:cover;background-position:center;filter:blur(38px) brightness(.3);opacity:.9}
.ato .in{position:relative;padding:0 1.5rem}
.ato .rom{font-size:clamp(5rem,30vh,20rem);line-height:.85;font-style:italic;color:transparent;-webkit-text-stroke:1px #77736c}
.ato h2{font-size:clamp(2.2rem,9vh,6.5rem);font-weight:400;margin:2vh 0 2.5vh;letter-spacing:-.015em}
.ato p{font-size:clamp(1rem,3vh,1.8rem);font-style:italic;color:#bdb9b0;max-width:34rem;margin:0 auto;line-height:1.45}

/* fim */
.fim{align-items:center;gap:clamp(1.5rem,4vw,5rem);padding:0 clamp(1.5rem,4vw,5rem)}
.fim{--t:min(34vh,calc((100vw - 26rem)/var(--c)*16/9))}
.grid{display:grid;grid-template-columns:repeat(var(--c),auto);gap:1vh;flex:none}
.grid a{display:block;height:var(--t);aspect-ratio:9/16;overflow:hidden;cursor:pointer;position:relative;background:#111}
.grid img{width:100%;height:100%;object-fit:cover;opacity:.82;transition:opacity .3s}
.grid a:hover img{opacity:1}
.grid a span{position:absolute;left:.5em;bottom:.4em;font-family:var(--sans);font-size:.7rem;letter-spacing:.1em;color:#fff;text-shadow:0 0 4px #000}
.fim .cr{flex:1;min-width:0}
.fim h2{font-size:clamp(1.6rem,5.2vh,3.6rem);font-weight:400;line-height:1;margin:2.5vh 0 3vh}
.fim h2 em{color:#bdb9b0}
.fim p{font-size:clamp(.9rem,2.15vh,1.25rem);line-height:1.6;color:#c9c5bd;margin:0 0 1.6vh}
.fim p.s{font-family:var(--sans);font-size:clamp(.68rem,1.5vh,.9rem);letter-spacing:.18em;text-transform:uppercase;color:var(--mute);line-height:2}

.fim .volta-cel{display:none;margin-top:2.5rem}
.fim .volta-cel a{color:var(--ink);text-decoration:none}

/* hud */
.hud{position:fixed;left:0;right:0;bottom:0;z-index:5;pointer-events:none;font-family:var(--sans);font-size:clamp(.62rem,1.4vh,.82rem);letter-spacing:.24em;text-transform:uppercase;color:#d8d4cc;text-shadow:0 0 6px #000,0 0 2px #000}
.hud .row{display:flex;justify-content:space-between;align-items:center;padding:0 clamp(1rem,2.2vw,2.5rem) 2.2vh}
.hud button{pointer-events:auto;background:rgba(0,0,0,.5);border:1px solid #6b6862;color:inherit;font:inherit;width:2.6em;height:2.6em;border-radius:50%;cursor:pointer;margin-left:.6em;letter-spacing:0;text-shadow:inherit}
.hud .volta{pointer-events:auto;color:inherit;text-decoration:none;opacity:.75}
.hud .volta:hover,.hud .volta:focus-visible{opacity:1}
.hud button,.ix button{display:inline-flex;align-items:center;justify-content:center;padding:0;vertical-align:middle}
.hud button svg,.ix button svg{width:1.4em;height:1.4em;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 2px #000)}
.hud button:hover{border-color:#fff}
.hud button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.bar{height:2px;background:var(--line)}
.bar i{display:block;height:100%;background:#d8d4cc;width:0;transition:width .5s ease}

.seg{display:none}
.hud #ixb{display:none}
.ix{position:fixed;inset:0;z-index:10;background:rgba(8,8,8,.97);overflow-y:auto;padding:1.1rem 1.25rem 2.5rem;font-family:var(--sans)}
.ix[hidden]{display:none}
.ixh{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.4rem}
.ix button{background:none;border:1px solid #6b6862;color:var(--ink);font:inherit;width:2.6rem;height:2.6rem;border-radius:50%;cursor:pointer}
.ixa{display:block;font-family:var(--serif);font-style:italic;font-size:1.35rem;color:var(--ink);margin:0 0 .7rem;cursor:pointer}
.ix .grid{margin-bottom:1.8rem}
.ix .volta{display:inline-block;margin-top:.4rem;font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);text-decoration:none}

/* celular: uma tela por vez, foto inteira com a legenda sobre o pe */
@media (max-aspect-ratio:1/1){
  .pg{flex-direction:column;overflow-y:auto;overscroll-behavior:contain;transition:opacity .35s ease,visibility 0s .35s}
  .pg.on{transition:opacity .35s ease}
  .ph,.pair .ph{position:absolute;inset:0;height:auto;width:auto;aspect-ratio:auto;background:var(--bg)}
  .ph img{object-fit:contain;object-position:50% 0;transform:none}
  .foto .tx,.capa .tx{position:absolute;left:0;right:0;bottom:0;flex:none;align-items:flex-start;text-align:left;justify-content:flex-end;gap:.7rem;
    padding:6rem 1.25rem calc(4.7rem + env(safe-area-inset-bottom));
    background:linear-gradient(transparent,rgba(0,0,0,.74) 36%,rgba(0,0,0,.93));transition:opacity .3s}
  body.limpo .foto .tx{opacity:0}
  body.limpo .hud .row{visibility:hidden}
  .lab{font-size:.68rem}
  .cap{max-width:none}
  .num{font-size:2.8rem;margin-bottom:.35rem;-webkit-text-stroke-color:#b5b1a9}
  .cap h2{font-size:clamp(1.7rem,8.5vw,3rem);margin-bottom:.6rem}
  .cap p{font-size:1.02rem;line-height:1.45;color:#dedad2}
  .capa .tx{gap:1.2rem}
  .capa h1{font-size:clamp(2.4rem,15vw,6rem);overflow-wrap:anywhere}
  .capa .sub{font-size:clamp(1.05rem,5vw,2rem);margin-top:.8rem}
  .capa .by{font-size:.7rem;line-height:1.8}
  .edit{justify-content:flex-start;padding:3.5rem 1.25rem calc(5rem + env(safe-area-inset-bottom))}
  .edit::before,.edit::after{content:"";flex:1}
  .edit .cols{grid-template-columns:1fr;margin-top:2rem}
  .edit .ans{font-size:clamp(1.7rem,9vw,3rem)}
  .edit p{font-size:1.1rem}
  .ato .rom{font-size:clamp(5rem,42vw,13rem)}
  .ato h2{font-size:clamp(2.2rem,12.5vw,5rem)}
  .ato p{font-size:1.15rem}
  .fim{flex-direction:column;align-items:stretch;justify-content:flex-start;gap:2rem;padding:3.5rem 1.25rem calc(5.5rem + env(safe-area-inset-bottom));--t:auto}
  .fim .cr{flex:none}
  .fim h2{font-size:clamp(1.6rem,9vw,3rem)}
  .fim p{font-size:1.05rem}
  .fim p.s{font-size:.75rem}
  .fim .volta-cel{display:block}
  .grid{grid-template-columns:repeat(4,1fr);width:100%;gap:.35rem}.grid a{height:auto}

  .hud{font-size:.8rem;letter-spacing:.12em;background:linear-gradient(transparent,rgba(0,0,0,.88) 55%)}
  body.limpo .hud{background:none}
  .hud .row{padding:1.6rem 1rem calc(.9rem + env(safe-area-inset-bottom))}
  .hud .volta,.hud #fs,.bar{display:none}
  .hud .ctl{display:flex;align-items:center;flex:1}
  .hud #ctr{margin-right:auto}
  .hud button{width:2.9em;height:2.9em}
  .hud #ixb{display:inline-flex}
  .seg{display:flex;gap:2px;position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;padding:calc(.55rem + env(safe-area-inset-top)) .6rem 0}
  .seg i{flex:1;height:2px;background:rgba(255,255,255,.3);box-shadow:0 0 3px rgba(0,0,0,.7)}
  .seg i.on{background:#fff}
  .seg i.g{margin-left:5px}
}
@media (prefers-reduced-motion:reduce){.pg,.pg.on,.ph img,.bar i{transition:none}.ph img{transform:none}}
</style>
</head>
<body>
<main id="m"></main>
<div class="seg" id="seg"></div>
<div class="ix" id="ix" hidden role="dialog" aria-label="Índice">
  <div class="ixh"><span class="lab">Índice</span><button id="ixx" aria-label="Fechar índice"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div id="ixl"></div>
  <a class="volta" href="../index.html">&#8592; Portfólios</a>
</div>
<div class="hud">
  <div class="row">
    <a class="volta" href="../index.html">&#8592; Portfólios</a>
    <span class="ctl"><span id="ctr"></span>
      <button id="ini" aria-label="Primeira página" title="Início (Home)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M18 6l-6 6 6 6"/></svg></button><button id="pv" aria-label="Página anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button><button id="nx" aria-label="Próxima página"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button><button id="ult" aria-label="Última página" title="Fim (End)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M6 6l6 6-6 6"/></svg></button><button id="fs" aria-label="Tela cheia" title="Tela cheia (F)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button><button id="ixb" aria-label="Índice"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg></button>
    </span>
  </div>
  <div class="bar"><i id="bar"></i></div>
</div>
<script>
/*__IMGS__*/
const ATOS={};for(const k in T.atos)ATOS[k]='Ato '+k+' — '+T.atos[k].titulo;
const C={};for(const k in T.fotos)C[k]={h:T.fotos[k].titulo,p:T.fotos[k].legenda};
const TIT=`${T.titulo} <em>${T.titulo_italico}</em>`;document.title=T.titulo+' '+T.titulo_italico+' — '+T.capa.autor;
const P=T.paginas.map((p,i)=>({t:{capa:'capa',editorial:'edit',ato:'ato',foto:'foto',final:'fim'}[p.tipo],a:p.ato,f:p.fotos,src:i}));
const pad=n=>String(n).padStart(2,'0');
const im=(n,alt)=>`<img src="${IMG[n]}" alt="${alt||C[n].h}">`;
const cap=n=>`<div class="cap"><div class="num">${pad(n)}</div><h2>${C[n].h}</h2><p>${C[n].p}</p></div>`;
const $=id=>document.getElementById(id);
const m=$('m'),ctr=$('ctr'),bar=$('bar'),seg=$('seg'),ix=$('ix'),ixl=$('ixl');
const mq=matchMedia('(max-aspect-ratio:1/1)');
let cel=mq.matches,pages=[],pgs=[],pageOf={},cur=0,limpo=false,ixok=false;
/* no celular cada tela leva uma foto so, e o editorial vira uma tela por pergunta */
function lista(){
 if(!cel)return P;
 const r=[];
 P.forEach(p=>{
  if(p.t==='foto'&&p.f.length>1)p.f.forEach(n=>r.push({...p,f:[n]}));
  else if(p.t==='edit')T.editorial.blocos.forEach((b,k)=>r.push({...p,b:k}));
  else r.push(p);
 });
 return r;
}
function render(){
 pages=lista();pageOf={};ixok=false;let solo=0;
 m.innerHTML=pages.map((p,i)=>{
  if(p.t==='capa')return `<section class="pg capa rev"><figure class="ph">${im(T.capa.foto,'Foto de capa')}</figure>
   <div class="tx" style="align-items:flex-start;text-align:left"><div class="lab">${T.capa.chamada}</div>
   <div><h1>${TIT}</h1><div class="sub">${T.subtitulo}</div></div>
   <div class="by"><b>${T.capa.autor}</b><br>${T.capa.linhas.join('<br>')}</div></div></section>`;
  if(p.t==='edit'){const bl=p.b===undefined?T.editorial.blocos:[T.editorial.blocos[p.b]];
   return `<section class="pg edit"><div class="lab">${T.editorial.chamada}</div><div class="cols">${bl.map(b=>`<div><h3>${b.pergunta}</h3><p class="ans">${b.resposta}</p>${b.paragrafos.map(x=>`<p>${x}</p>`).join('')}</div>`).join('')}</div></section>`;}
  if(p.t==='ato')return `<section class="pg ato"><div class="bgim" style="background-image:url(${IMG[T.atos[p.a].fundo]})"></div>
   <div class="in"><div class="rom">${p.a}</div><h2>${T.atos[p.a].titulo}</h2><p>${T.atos[p.a].frase}</p></div></section>`;
  if(p.t==='foto'){
   p.f.forEach(n=>pageOf[n]=i);
   if(p.f.length===1){const r=(solo++%2)?' rev':'';
    return `<section class="pg foto${r}"><figure class="ph">${im(p.f[0])}</figure><div class="tx"><div class="lab">${ATOS[p.a]||''}</div>${cap(p.f[0])}</div></section>`;}
   return `<section class="pg foto pair"><figure class="ph">${im(p.f[0])}</figure>
    <div class="tx">${cap(p.f[0])}<div class="lab">${ATOS[p.a]||''}</div>${cap(p.f[1])}</div><figure class="ph">${im(p.f[1])}</figure></section>`;
  }
  return `<section class="pg fim" style="--c:${Math.ceil(Object.keys(C).length/2)}"><div class="grid">${Object.keys(C).map(n=>`<a data-go="${n}" title="${C[n].h}">${im(n)}<span>${pad(n)}</span></a>`).join('')}</div>
   <div class="cr"><div class="lab">${T.final.chamada}</div><h2>${TIT}</h2>
   <p>${T.final.texto}</p>${T.final.creditos.map(c=>`<p class="s">${c.rotulo}<br><span style="color:var(--ink)">${c.linhas.join('<br>')}</span></p>`).join('')}<p class="s volta-cel"><a href="../index.html">&#8592; Portfólios</a></p></div></section>`;
 }).join('');
 pgs=[...m.children];
 /* um tracinho por tela, com folga entre os grupos (abertura, cada ato, final) */
 const g=p=>p.a||p.t;
 seg.innerHTML=pages.map((p,i)=>`<i${i&&g(p)!==g(pages[i-1])?' class="g"':''}></i>`).join('');
}
function go(i){
 i=Math.max(0,Math.min(pgs.length-1,i));
 pgs[cur].classList.remove('on');cur=i;pgs[cur].classList.add('on');
 ctr.textContent=pad(cur+1)+' / '+pad(pgs.length);
 bar.style.width=((cur+1)/pgs.length*100)+'%';
 [...seg.children].forEach((s,k)=>s.classList.toggle('on',k<=cur));
 document.body.classList.toggle('limpo',limpo&&pages[cur].t==='foto');
 try{history.replaceState(null,'','#'+(cur+1));}catch(e){}
}
function full(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();}
function indice(abre){
 if(abre&&!ixok){
  let h='',ab=false;
  pages.forEach((p,i)=>{
   if(p.t==='ato'){if(ab)h+='</div>';ab=false;h+=`<a class="ixa" data-pg="${i}">${ATOS[p.a]}</a>`;}
   else if(p.t==='foto'){if(!ab){h+='<div class="grid">';ab=true;}h+=p.f.map(n=>`<a data-pg="${i}" title="${C[n].h}">${im(n)}<span>${pad(n)}</span></a>`).join('');}
  });
  ixl.innerHTML=h+(ab?'</div>':'');ixok=true;
 }
 ix.hidden=!abre;
}
addEventListener('keydown',e=>{
 if(!ix.hidden){if(e.key==='Escape')indice(false);return;}
 if(e.key==='f'||e.key==='F'){full();return;}
 if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();go(cur+1);}
 else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();go(cur-1);}
 else if(e.key==='Home')go(0);else if(e.key==='End')go(pgs.length-1);
});
const bt=(id,f)=>$(id).onclick=e=>{e.stopPropagation();f();};
bt('pv',()=>go(cur-1));bt('nx',()=>go(cur+1));
bt('ini',()=>go(0));bt('ult',()=>go(pgs.length-1));
bt('fs',full);bt('ixb',()=>indice(true));bt('ixx',()=>indice(false));
ix.addEventListener('click',e=>{const a=e.target.closest('[data-pg]');if(a){indice(false);go(+a.dataset.pg);}});
m.addEventListener('click',e=>{
 const a=e.target.closest('[data-go]');
 if(a){go(pageOf[a.dataset.go]);return;}
 if(e.target.closest('a[href]'))return;
 const x=e.clientX/innerWidth;
 if(!cel){go(cur+(x<.3?-1:1));return;}
 /* celular: bordas viram a pagina; o meio de uma foto esconde ou mostra a legenda */
 if(x<.3)go(cur-1);else if(x>.7||pages[cur].t!=='foto')go(cur+1);
 else{limpo=!limpo;document.body.classList.toggle('limpo',limpo);}
});
let tx=null,ty=0;
addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
addEventListener('touchend',e=>{if(tx===null||!ix.hidden)return;const t=e.changedTouches[0],d=t.clientX-tx,v=t.clientY-ty;tx=null;if(Math.abs(d)>50&&Math.abs(d)>Math.abs(v)*1.2)go(cur+(d<0?1:-1));},{passive:true});
let wl=0;addEventListener('wheel',e=>{if(cel||!ix.hidden)return;const t=Date.now();if(t-wl<700||Math.abs(e.deltaY)<20)return;wl=t;go(cur+(e.deltaY>0?1:-1));},{passive:true});
/* ao girar o aparelho a lista de telas muda: remonta e volta para a mesma pagina */
mq.addEventListener('change',()=>{const s=pages[cur].src;cel=mq.matches;indice(false);render();cur=0;go(Math.max(0,pages.findIndex(p=>p.src===s)));});
