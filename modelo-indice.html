<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfólios — <!--__AUTOR__--></title>
<style>
:root{
  --bg:#0a0a0a; --ink:#ece9e2; --mute:#8f8c85; --faint:#6a6761; --line:#262523;
  --serif:"Palatino Linotype","Book Antiqua",Palatino,"Iowan Old Style",Georgia,serif;
  --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif)}
body{-webkit-font-smoothing:antialiased;min-height:100vh;padding:clamp(2.5rem,9vh,7rem) clamp(1.25rem,6vw,7rem)}
.lab{font-family:var(--sans);font-size:clamp(.68rem,.8vw,.85rem);letter-spacing:.28em;text-transform:uppercase;color:var(--mute)}
header{border-bottom:1px solid var(--line);padding-bottom:clamp(1.5rem,4vh,3rem);margin-bottom:clamp(2rem,6vh,4.5rem)}
h1{font-size:clamp(2.8rem,9vw,7.5rem);font-weight:400;font-style:italic;line-height:.95;letter-spacing:-.025em;margin:.25em 0 0}
.lista{display:flex;flex-wrap:wrap;gap:clamp(2rem,4vw,4rem)}
.cartao{display:block;width:clamp(15rem,24vw,21rem);color:inherit;text-decoration:none}
.cartao figure{margin:0 0 1.4rem;aspect-ratio:9/16;overflow:hidden;background:#111}
.cartao img{display:block;width:100%;height:100%;object-fit:cover;opacity:.88;transition:opacity .4s,transform 1.6s ease-out}
.cartao:hover img,.cartao:focus-visible img{opacity:1;transform:scale(1.03)}
.cartao:focus-visible{outline:2px solid #fff;outline-offset:6px}
.cartao h2{font-size:clamp(1.7rem,2.6vw,2.5rem);font-weight:400;line-height:1.02;letter-spacing:-.01em;margin:.7rem 0 .5rem}
.cartao h2 em{color:#bdb9b0}
.cartao p{font-size:1.1rem;font-style:italic;color:var(--mute);margin:0}
@media (max-width:40rem){.cartao{width:100%}}
@media (prefers-reduced-motion:reduce){.cartao img{transition:none}.cartao:hover img{transform:none}}
</style>
</head>
<body>
<header>
  <div class="lab"><!--__AUTOR__--> · Fotografia</div>
  <h1>Portfólios</h1>
</header>
<main class="lista">
<!--__CARTOES__-->
</main>
</body>
</html>
